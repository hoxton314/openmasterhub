[package]
name = "openmasterhub-app"
description = "OpenMasterHUB desktop app (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "openmasterhub_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "openmasterhub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
base64 = "0.23.1"
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif"] }
log = "0.4.34"
masterhub-core = { path = "../../crates/masterhub-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"
zbus = "5.19.0"
