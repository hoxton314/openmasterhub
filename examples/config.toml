# openmasterhub example configuration
# Copy to ~/.config/openmasterhub/config.toml, or %APPDATA%\openmasterhub\config.toml on
# Windows (the GUI edits this file for you).
#
# Actions:
#   { cmd = "shell command" }       run with sh -c, or cmd /C on Windows
#                                   ({value} = fader position 0..100)
#   { keys = "ctrl+shift+m" }       virtual keyboard; names from linux/input-event-codes.h
#                                   without KEY_ (playpause, volumeup, f13, ...)
#   { volume = "+2" }               default output volume: "+2"/"-2" change it, "40" sets
#                                   it, "{value}" follows a fader
#   { mute = "toggle" }             mute the default output: toggle, on, off
#   { page = "next" | "prev" | "<page name>" }
#   { folder = "<folder name>" }    open a keypad folder
#   { back = true }                 leave the folder
#   { profile = "<profile name>" }  switch profile
#   { session = 0 }                 bring up a Claude Code session by slot (see the widget)
#
# Widgets (key or dial face): { kind = "clock", format = "%H:%M" }, cpu_usage, cpu_temp,
#   ram_usage, gpu_usage, gpu_temp, volume, now_playing, and { kind = "claude_session", slot = 0 }
#   (an open Claude Code session, oldest first: its name and status; see docs/CLAUDE_CODE.md).
#   On Windows, cpu_temp (and the GPU widgets without an NVIDIA driver) read
#   LibreHardwareMonitor while it runs.
# Images: PNG/JPEG, or GIF (animated).
#
# The first profile is the default. Other profiles activate when the focused window's class
# matches one of their `apps` (Hyprland window class, or the .exe name on Windows;
# case-insensitive, * wildcards).

backlight = 80

[leds]
base = "#ff2020"
fader = ["#ff0000", "#ff8000", "#ffff00", "#00ff00", "#0080ff"]   # top..bottom
knob = ["#ff0000", "#00ff00", "#0000ff"]                           # bottom-left, bottom-right, top
brightness = 100

# Base LED while Claude Code sessions run (hooks call `masterhubd claude-hook`, see
# docs/CLAUDE_CODE.md). The most urgent session wins; without sessions the Base keeps [leds].
[status]
attention = "#ff4000"   # a session waits for your answer: flashes
ready = "#00ff40"       # finished, waiting for a new prompt
working = "#0060ff"

# ─────────────────────────────── Default profile ───────────────────────────────
[[profile]]
name = "Default"

[[profile.page]]
name = "Main"

[[profile.page.key]]
index = 0
label = "Play"
background = "#1e5ac8"
press = { keys = "playpause" }

[[profile.page.key]]
index = 1
label = "Prev"
background = "#283c64"
press = { keys = "previoussong" }

[[profile.page.key]]
index = 2
label = "Next"
background = "#283c64"
press = { keys = "nextsong" }

[[profile.page.key]]
index = 3
widget = { kind = "clock" }
background = "#101010"

[[profile.page.key]]
index = 4
label = "Mute"
background = "#c81e1e"
press = { mute = "toggle" }

[[profile.page.key]]
index = 5
widget = { kind = "cpu_usage" }

[[profile.page.key]]
index = 6
widget = { kind = "gpu_usage" }

[[profile.page.key]]
index = 7
widget = { kind = "ram_usage" }

[[profile.page.key]]
index = 9
label = "Claude"
background = "#c15f3c"
press = { profile = "Claude" }

[[profile.page.key]]
index = 10
label = "Apps"
background = "#3a3a46"
press = { folder = "Apps" }

[[profile.page.key]]
index = 14
label = "Page 2"
background = "#3a3a46"
press = { page = "next" }

[[profile.page]]
name = "Second"

[[profile.page.key]]
index = 0
widget = { kind = "now_playing" }
press = { keys = "playpause" }

[[profile.page.key]]
index = 14
label = "Back"
background = "#3a3a46"
press = { page = "prev" }

[[profile.folder]]
name = "Apps"

[[profile.folder.key]]
index = 0
label = "Back"
background = "#3a3a46"
press = { back = true }

[[profile.folder.key]]
index = 1
label = "Term"
background = "#202020"
press = { cmd = "xdg-terminal-exec || kitty || foot" }

[[profile.folder.key]]
index = 2
label = "Files"
background = "#202020"
press = { cmd = "xdg-open ~" }

[profile.dial]
widget = { kind = "volume" }
cw = { volume = "+1" }
ccw = { volume = "-1" }
press = { mute = "toggle" }

[[profile.fader]]
index = 0
change = { volume = "{value}" }

[[profile.knob]]
index = 2
cw = { keys = "volumeup" }
ccw = { keys = "volumedown" }
press = { keys = "mute" }

[[profile.roller]]
side = "left"
away = { keys = "up" }
toward = { keys = "down" }

[[profile.roller]]
side = "right"
away = { keys = "pageup" }
toward = { keys = "pagedown" }

# ─────────────────────── OBS profile (active while OBS is focused) ───────────────────────
[[profile]]
name = "Streaming"
apps = ["com.obsproject.Studio", "obs"]

[profile.leds]
base = "#8000ff"

[[profile.page]]
name = "Scenes"

[[profile.page.key]]
index = 0
label = "Scene 1"
background = "#6a1b9a"
press = { keys = "ctrl+alt+f1" }

[[profile.page.key]]
index = 1
label = "Scene 2"
background = "#6a1b9a"
press = { keys = "ctrl+alt+f2" }

[[profile.page.key]]
index = 4
widget = { kind = "cpu_temp" }

[profile.dial]
widget = { kind = "cpu_usage" }

# ──────────── Claude profile: a key per open Claude Code session (docs/CLAUDE_CODE.md) ────────────
# Active while the Claude desktop app is focused, or from the Default profile's Claude key.
# Each key shows a session's name and the mascot in its status colour ([status] above);
# pressing it brings that session up: in the Claude app, or the terminal window it runs in.
[[profile]]
name = "Claude"
apps = ["com.anthropic.Claude", "claude.exe"]

[[profile.page]]
name = "Sessions"

[[profile.page.key]]
index = 0
widget = { kind = "claude_session", slot = 0 }
press = { session = 0 }

[[profile.page.key]]
index = 1
widget = { kind = "claude_session", slot = 1 }
press = { session = 1 }

[[profile.page.key]]
index = 2
widget = { kind = "claude_session", slot = 2 }
press = { session = 2 }

[[profile.page.key]]
index = 3
widget = { kind = "claude_session", slot = 3 }
press = { session = 3 }

[[profile.page.key]]
index = 4
widget = { kind = "claude_session", slot = 4 }
press = { session = 4 }

[[profile.page.key]]
index = 5
widget = { kind = "claude_session", slot = 5 }
press = { session = 5 }

[[profile.page.key]]
index = 6
widget = { kind = "claude_session", slot = 6 }
press = { session = 6 }

[[profile.page.key]]
index = 7
widget = { kind = "claude_session", slot = 7 }
press = { session = 7 }

[[profile.page.key]]
index = 8
widget = { kind = "claude_session", slot = 8 }
press = { session = 8 }

[[profile.page.key]]
index = 9
widget = { kind = "claude_session", slot = 9 }
press = { session = 9 }

[[profile.page.key]]
index = 10
widget = { kind = "claude_session", slot = 10 }
press = { session = 10 }

[[profile.page.key]]
index = 11
widget = { kind = "claude_session", slot = 11 }
press = { session = 11 }

[[profile.page.key]]
index = 12
widget = { kind = "claude_session", slot = 12 }
press = { session = 12 }

[[profile.page.key]]
index = 13
label = "New"
background = "#c15f3c"
press = { cmd = "xdg-open claude://code/new" }   # Windows: start claude://code/new

[[profile.page.key]]
index = 14
label = "Back"
background = "#3a3a46"
press = { profile = "Default" }
