[package]
name = "masterhubd"
description = "Background service for the Cooler Master MasterHUB"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
ctrlc = { version = "3.5.2", features = ["termination"] }
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif"] }
interprocess = "2.4.5"
jiff = "0.2.38"
log = "0.4.34"
masterhub-core = { path = "../masterhub-core" }
masterhub-proto = { path = "../masterhub-proto" }
nvml-wrapper = "0.13.0"
serde = "1.0.229"
serde_json = "1.0.154"

# MPRIS (now playing) over D-Bus.
[target.'cfg(not(windows))'.dependencies]
zbus = "5.19.0"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
widestring = "1.2.1"
# COM and WinRT: Core Audio, media sessions (now playing), WMI (LibreHardwareMonitor sensors).
windows = { version = "0.62.2", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Wmi",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
