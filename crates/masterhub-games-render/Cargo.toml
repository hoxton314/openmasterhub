[package]
name = "masterhub-games-render"
description = "Key and dial faces of the OpenMasterHUB game modes"
version.workspace = true
edition.workspace = true
# From PULPIT by Dawid Gorczyca (MIT OR Apache-2.0), used under MIT: see LICENSE.
license = "MIT"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
anyhow = "1.0.104"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout"] }
svgtypes = "0.15"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "gif"] }
