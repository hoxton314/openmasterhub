// PULPIT hub keys for Deadlock: console commands on the navigation keys, which the game's own
// binds leave free (F13-F24 never reach the game: X turns them into media keys; tested
// 2026-11-23). Client-side settings only, nothing that needs sv_cheats.
// Installed by games/deadlock/tools/install-cfg.sh; run from autoexec.cfg ("exec pulpit"), which
// the game runs by itself at start. The game also saves the binds with the user's own
// (userdata/<id>/1422450/local/cfg/user_keys_0_slot0.vcfg), so they stay until unbound.
// del: ping readout between 1 (only when poor, the game's default) and 2 (always).
bind home "toggle citadel_hud_visible"
bind end "toggle citadel_photomode_enabled"
bind ins "toggle cl_showfps 0 1"
bind del "toggle cl_hud_telemetry_ping_show 1 2"
bind pgup "citadel_toggle_mute"
bind pgdn "toggle voice_modenable"
bind pause "ping_quick_response"
bind scrolllock "toggle citadel_hide_replay_hud"
// Leftovers of the first test (the game saves every bind it is given): make sure they are gone.
unbind f10
unbind f11
unbind f13
unbind f14
unbind f15
unbind f16
unbind f17
unbind f18
unbind f19
unbind f20
unbind f21
unbind f23
unbind f24
echo "PULPIT binds loaded"
