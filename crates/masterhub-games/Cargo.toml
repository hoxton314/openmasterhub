[package]
name = "pulpit"
description = "PULPIT: the KREATURA layer for the MasterHUB (daily mode, live faces)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pulpit-render = { path = "../pulpit-render" }
masterhub-core = { path = "../../../openmasterhub/crates/masterhub-core" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
jiff = "0.2"
