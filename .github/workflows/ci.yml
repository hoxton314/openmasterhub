name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Arch: the GUI needs GTK 4.18 / libadwaita 1.7, newer than Ubuntu runners ship, and it
    # matches what the AUR package is built and used on.
    container: archlinux:base-devel

    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git rust gtk4 libadwaita pkgconf

      - uses: actions/checkout@v4

      - uses: swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked
