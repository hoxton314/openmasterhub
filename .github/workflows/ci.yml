name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Arch: matches what the AUR package is built and used on.
    container: archlinux:base-devel

    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git rust nodejs npm webkit2gtk-4.1 gtk3 pkgconf

      - uses: actions/checkout@v4

      # The Tauri crate embeds the built frontend, so it has to exist before any cargo step.
      - name: Frontend
        working-directory: app
        run: |
          npm ci
          npm run check
          npm run build

      - uses: swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked
